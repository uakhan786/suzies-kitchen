<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kitchen Display — Suzie's Pastry Shoppe</title>
<style>
:root {
  --ink: #1c1612;
  --ink-mid: #6b5e54;
  --ink-light: #b0a49a;
  --bg: #111;
  --surface: #1e1e1e;
  --surface2: #2a2a2a;
  --border: #333;
  --border2: #444;
  --white: #fff;
  --rose: #e05a72;
  --rose-dim: #8c3347;
  --green: #4caf7d;
  --green-dim: #1e5c3a;
  --amber: #f5a623;
  --amber-dim: #7a5010;
  --amber-bg: #2a2010;
  --red: #e05252;
  --s1: #5ba3e0; --s1-bg: #0d2a40; --s1-border: #2a5a80;
  --s2: #9b85e0; --s2-bg: #1a1240; --s2-border: #4a3880;
  --s3: #5ac47a; --s3-bg: #0d2a1a; --s3-border: #2a6040;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--white); height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 15px; }

/* TOPBAR */
.topbar { background: #0d0d0d; border-bottom: 1px solid var(--border); padding: 0 18px; height: 54px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.brand { display: flex; flex-direction: column; }
.brand-name { font-size: 15px; font-weight: 700; color: var(--white); }
.brand-sub { font-size: 10px; color: var(--ink-light); letter-spacing: 0.07em; text-transform: uppercase; }
.topbar-stats { display: flex; align-items: center; gap: 20px; margin-left: 20px; }
.tstat { font-size: 12px; color: #666; }
.tstat strong { color: var(--white); font-size: 15px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.live-pill { display: flex; align-items: center; gap: 6px; background: var(--green-dim); border: 1px solid var(--green); border-radius: 20px; padding: 4px 10px; font-size: 11px; color: var(--green); font-weight: 600; }
.ldot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
.ldot.err { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
.clock { font-size: 20px; font-weight: 300; color: var(--white); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

/* TAB BAR */
.tabbar { background: #151515; border-bottom: 1px solid var(--border); padding: 0 16px; height: 46px; display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.ktab { padding: 0 16px; height: 100%; font-size: 13px; font-weight: 600; cursor: pointer; color: #666; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 8px; transition: all .15s; white-space: nowrap; }
.ktab:hover { color: #aaa; }
.ktab.on { color: var(--white); border-bottom-color: var(--rose); }
.ktab.sq.on { color: var(--amber); border-bottom-color: var(--amber); }
.badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: var(--surface2); color: #888; min-width: 20px; text-align: center; }
.ktab.on .badge { background: var(--rose-dim); color: var(--rose); }
.ktab.sq.on .badge { background: var(--amber-dim); color: var(--amber); }
.tab-spacer { flex: 1; }
.last-refresh { font-size: 11px; color: #555; }

/* CONTENT */
.content { flex: 1; overflow-y: auto; padding: 12px; }
.stn-grid { display: grid; gap: 12px; height: 100%; }

/* STATION COLUMN */
.stn-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
.stn-hdr { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface2); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.stn-name { font-size: 15px; font-weight: 700; color: var(--white); }
.stn-cnt { font-size: 12px; color: #666; }
.stn-cnt.has-orders { color: var(--amber); font-weight: 600; }
.stn-pills { padding: 7px 16px 9px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 5px; flex-shrink: 0; background: #181818; }
.pill { font-size: 10px; padding: 3px 8px; border-radius: 10px; background: #2a2a2a; color: #888; border: 1px solid var(--border); }
.stn-orders { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.stn-empty { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: #444; font-size: 13px; padding: 30px; }
.stn-empty-icon { font-size: 28px; }

/* ORDER CARD */
.kcard { border: 1px solid var(--border2); border-radius: 9px; overflow: hidden; animation: slideIn .22s ease; background: #252525; }
.kcard.sqc { border-color: var(--amber-dim); }
.kcard.fresh { border-color: var(--rose-dim); box-shadow: 0 0 0 1px var(--rose-dim); }
@keyframes slideIn { from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)} }
.kctop { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #2e2e2e; flex-wrap: wrap; gap: 6px; }
.kcard.sqc .kctop { background: var(--amber-bg); }
.kmeta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kid { font-size: 12px; font-weight: 700; color: #aaa; }
.stag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
.stag.s1 { background: var(--s1-bg); color: var(--s1); border: 1px solid var(--s1-border); }
.stag.s2 { background: var(--s2-bg); color: var(--s2); border: 1px solid var(--s2-border); }
.stag.s3 { background: var(--s3-bg); color: var(--s3); border: 1px solid var(--s3-border); }
.rbadge { font-size: 10px; padding: 2px 7px; border-radius: 8px; background: #333; color: #888; border: 1px solid #444; }
.sqbadge { font-size: 10px; padding: 2px 7px; border-radius: 8px; background: var(--amber-dim); color: var(--amber); }
.ktime { font-size: 11px; color: #555; font-variant-numeric: tabular-nums; }
.kcust { padding: 7px 12px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #777; }
.kcust-name { color: #ccc; font-weight: 600; }
.kcust-phone { color: #666; }
.kitems { padding: 6px 12px; }
.kitem { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #2e2e2e; }
.kitem:last-child { border-bottom: none; }
.kitem-name { font-size: 15px; color: var(--white); font-weight: 500; }
.kitem-qty { font-size: 18px; font-weight: 700; color: var(--white); }
.kitem-unit { font-size: 12px; color: #666; margin-left: 3px; }
.kfoot { padding: 7px 12px; border-top: 1px solid #2e2e2e; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.knote { font-size: 11px; color: #666; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
.bump-btn { font-size: 13px; font-weight: 700; padding: 7px 16px; border-radius: 7px; border: 1px solid #444; background: #333; color: #888; cursor: pointer; transition: all .15s; white-space: nowrap; }
.bump-btn:hover { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.bump-btn:active { transform: scale(0.96); }

/* STATUS BAR */
.statusbar { background: #0d0d0d; border-top: 1px solid var(--border); padding: 6px 18px; font-size: 11px; color: #555; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.statusbar span { color: #444; }
.statusbar strong { color: #777; }

/* LOADING */
.loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; z-index: 999; }
.spinner { width: 36px; height: 36px; border: 3px solid #333; border-top-color: var(--rose); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.loading-txt { font-size: 14px; color: #666; }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-txt">Connecting to Suzie's Pastry Shoppe…</div>
</div>

<div class="topbar">
  <div class="brand">
    <span class="brand-name">🍽 Suzie's Pastry Shoppe</span>
    <span class="brand-sub">Kitchen Display System</span>
  </div>
  <div class="topbar-stats">
    <div class="tstat">Active <strong id="s-active">0</strong></div>
    <div class="tstat">Small queue <strong id="s-small" style="color:var(--amber)">0</strong></div>
    <div class="tstat">Bumped today <strong id="s-bumped">0</strong></div>
  </div>
  <div class="topbar-right">
    <div class="live-pill"><div class="ldot" id="ldot"></div><span id="live-lbl">Live</span></div>
    <div class="clock" id="clk"></div>
  </div>
</div>

<div class="tabbar">
  <div class="ktab on" onclick="selK(1)" id="kt-1">Kitchen 1 <span class="badge" id="k1-cnt">0</span></div>
  <div class="ktab" onclick="selK(2)" id="kt-2">Kitchen 2 <span class="badge" id="k2-cnt">0</span></div>
  <div class="ktab sq" onclick="selK('sq')" id="kt-sq">⚠ Small Orders <span class="badge" id="sq-cnt">0</span></div>
  <div class="tab-spacer"></div>
  <div class="last-refresh" id="last-refresh">Refreshing…</div>
</div>

<div class="content">
  <div class="stn-grid" id="stn-grid"></div>
</div>

<div class="statusbar">
  <span>Last bump: <strong id="last-bump">—</strong></span>
  <span id="bump-log"></span>
</div>

<script>
const SUPABASE_URL = 'https://smtjucjdknxzjjyhmclu.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdGp1Y2pka254empqeWhtY2x1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMjI5MjEsImV4cCI6MjA5MzY5ODkyMX0.pYpmmj12_mkXT4i-9kAO4W8_3VcmJ8fgkB9w2KJxbE'
const API = `${SUPABASE_URL}/rest/v1/orders`
const REALTIME = `${SUPABASE_URL.replace('https','wss')}/realtime/v1/websocket?apikey=${SUPABASE_KEY}&vsn=1.0.0`
const HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }

const PRODS = [
  {id:'wb',name:'Wholesale Baklava', k:1,stn:'k1s1',unit:'lb'},
  {id:'rb',name:'Retail Baklava',    k:1,stn:'k1s3',unit:'lb'},
  {id:'pf',name:'Petit Four',        k:1,stn:'k1s1',unit:'pcs'},
  {id:'ac',name:'Arabic Cookies',    k:1,stn:'k1s3',unit:'pcs'},
  {id:'fs',name:'Fried Sweets',      k:1,stn:'k1s3',unit:'pcs'},
  {id:'ku',name:'Kunafah',           k:1,stn:'k1s2',unit:'pcs'},
  {id:'ma',name:'Mamoul',            k:1,stn:'k1s2',unit:'lb'},
  {id:'ha',name:'Halawat Eljiben',   k:1,stn:'k1s1',unit:'lb'},
  {id:'aw',name:'Awehma',            k:1,stn:'k1s2',unit:'pcs'},
  {id:'mf',name:'Mille Feuille',     k:1,stn:'k1s2',unit:'pcs'},
  {id:'dc',name:'Daily Cakes',       k:2,stn:'k2s1',unit:'pcs'},
  {id:'cs',name:'Cake Slices',       k:2,stn:'k2s1',unit:'pcs'},
  {id:'db',name:'Dubai Chocolate',   k:2,stn:'k2s1',unit:'pcs'},
]
const STNS = {
  k1s1:{name:'Station 1',k:1,prods:['Wholesale Baklava','Petit Four','Halawat Eljiben']},
  k1s2:{name:'Station 2',k:1,prods:['Kunafah','Mamoul','Awehma','Mille Feuille']},
  k1s3:{name:'Station 3',k:1,prods:['Retail Baklava','Arabic Cookies','Fried Sweets']},
  k2s1:{name:'Station 1',k:2,prods:['Daily Cakes','Cake Slices','Dubai Chocolate']},
}

let ak=1, allOrders=[], bumpedCount=0, recentBumps=[], newIds=new Set()
const $=id=>document.getElementById(id)
const p=id=>PRODS.find(x=>x.id===id)
const now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})

function selK(k){
  ak=k
  ;['1','2','sq'].forEach(x=>{ $('kt-'+x).classList.remove('on') })
  $('kt-'+k).classList.add('on')
  render()
}

function storeTag(s){ return `<span class="stag s${s}">Store ${s}</span>` }

function kCardHTML(o, items){
  const it = items || o.items
  const isFresh = newIds.has(o.id)
  const showCust = o.otype !== 'restock' && o.cust_name
  return `<div class="kcard${o.small?' sqc':''}${isFresh?' fresh':''}" id="card-${o.id}">
    <div class="kctop">
      <div class="kmeta">
        <span class="kid">${o.id}</span>
        ${storeTag(o.store)}
        ${o.otype==='restock'?'<span class="rbadge">Restock</span>':''}
        ${o.small?'<span class="sqbadge">⚠ Small</span>':''}
      </div>
      <span class="ktime">${o.created_at ? new Date(o.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''}</span>
    </div>
    ${showCust?`<div class="kcust">👤 <span class="kcust-name">${o.cust_name}</span>${o.cust_phone?`<span class="kcust-phone">· ${o.cust_phone}</span>`:''}</div>`:''}
    <div class="kitems">
      ${it.map(l=>{
        const pr=p(l.pid)||{name:l.pid,unit:''}
        return `<div class="kitem">
          <span class="kitem-name">${pr.name}</span>
          <span><span class="kitem-qty">${l.qty}</span><span class="kitem-unit">${pr.unit}</span></span>
        </div>`
      }).join('')}
    </div>
    <div class="kfoot">
      <span class="knote">${o.notes?'📝 '+o.notes:''}</span>
      <button class="bump-btn" onclick="bumpOrder('${o.id}')">✓ Done</button>
    </div>
  </div>`
}

function render(){
  const active = allOrders.filter(o=>!o.bumped)
  const k1 = active.filter(o=>!o.small&&o.kitchen==='1').length
  const k2 = active.filter(o=>!o.small&&o.kitchen==='2').length
  const sq = active.filter(o=>o.small).length

  $('s-active').textContent = k1+k2
  $('s-small').textContent = sq
  $('s-bumped').textContent = bumpedCount
  $('k1-cnt').textContent = k1
  $('k2-cnt').textContent = k2
  $('sq-cnt').textContent = sq

  const grid = $('stn-grid')

  if(ak==='sq'){
    grid.style.gridTemplateColumns='1fr'
    const sqOrds = active.filter(o=>o.small)
    if(!sqOrds.length){
      grid.innerHTML=`<div class="stn-col"><div class="stn-hdr"><span class="stn-name">⚠ Small / Express Queue</span><span class="stn-cnt">All clear</span></div><div class="stn-orders"><div class="stn-empty"><div class="stn-empty-icon">✓</div>Small queue is clear</div></div></div>`
      return
    }
    grid.innerHTML=`<div class="stn-col">
      <div class="stn-hdr"><span class="stn-name">⚠ Small / Express Queue</span><span class="stn-cnt has-orders">${sqOrds.length} pending</span></div>
      <div class="stn-pills"><span class="pill">Cookies</span><span class="pill">Fried Sweets</span><span class="pill">Baklava &lt;5lb</span><span class="pill">Mamoul &lt;5lb</span><span class="pill">Cake Slices ≤2</span><span class="pill">Halawat ≤2lb</span></div>
      <div class="stn-orders">${sqOrds.map(o=>kCardHTML(o,null)).join('')}</div>
    </div>`
    return
  }

  const stns = Object.entries(STNS).filter(([,s])=>s.k===ak)
  grid.style.gridTemplateColumns = `repeat(${stns.length},1fr)`
  grid.innerHTML = stns.map(([sid,s])=>{
    const stnOrds = active.filter(o=>!o.small&&o.kitchen===String(ak)&&o.items.some(l=>{const pr=p(l.pid);return pr&&pr.stn===sid}))
    const cards = stnOrds.map(o=>{
      const items = o.items.filter(l=>{const pr=p(l.pid);return pr&&pr.stn===sid})
      return kCardHTML(o,items)
    }).join('')
    return `<div class="stn-col">
      <div class="stn-hdr">
        <span class="stn-name">${s.name}</span>
        <span class="stn-cnt${stnOrds.length?' has-orders':''}">${stnOrds.length ? stnOrds.length+' order'+(stnOrds.length!==1?'s':'') : 'All clear'}</span>
      </div>
      <div class="stn-pills">${s.prods.map(x=>`<span class="pill">${x}</span>`).join('')}</div>
      <div class="stn-orders">${cards||'<div class="stn-empty"><div class="stn-empty-icon">✓</div>All clear</div>'}</div>
    </div>`
  }).join('')
}

async function fetchOrders(){
  try {
    const r = await fetch(`${API}?bumped=eq.false&order=created_at.asc`, {headers: HEADERS})
    if(!r.ok) throw new Error()
    allOrders = await r.json()
    $('last-refresh').textContent = 'Updated '+now()
    $('ldot').classList.remove('err')
    $('live-lbl').textContent = 'Live'
    document.getElementById('loading').style.display='none'
    render()
  } catch {
    $('ldot').classList.add('err')
    $('live-lbl').textContent = 'Reconnecting…'
  }
}

async function bumpOrder(id){
  const btn = document.querySelector(`#card-${id} .bump-btn`)
  if(btn){ btn.textContent='…'; btn.disabled=true }
  try {
    const now_ts = new Date().toISOString()
    const r = await fetch(`${API}?id=eq.${id}`, {
      method: 'PATCH',
      headers: {...HEADERS, 'Content-Type':'application/json', 'Prefer':'return=minimal'},
      body: JSON.stringify({bumped:true, bumped_at: now_ts})
    })
    if(!r.ok) throw new Error()
    allOrders = allOrders.map(o=>o.id===id?{...o,bumped:true}:o)
    bumpedCount++
    const o = allOrders.find(x=>x.id===id)
    if(o){
      const label = `${o.id}${o.cust_name?' ('+o.cust_name+')':''} at ${now()}`
      recentBumps.unshift(label)
      $('last-bump').textContent = label
    }
    render()
  } catch {
    if(btn){ btn.textContent='✓ Done'; btn.disabled=false }
    alert('Could not bump order — check connection.')
  }
}

// Realtime via Supabase WebSocket
function connectRealtime(){
  let ws
  function connect(){
    ws = new WebSocket(REALTIME)
    ws.onopen = ()=>{
      ws.send(JSON.stringify({topic:'realtime:public:orders',event:'phx_join',payload:{},ref:1}))
    }
    ws.onmessage = e=>{
      try {
        const msg = JSON.parse(e.data)
        if(msg.event==='INSERT'||msg.event==='UPDATE'||msg.event==='DELETE'){
          // slight delay to let DB settle
          setTimeout(fetchOrders, 300)
        }
        // heartbeat
        if(msg.event==='phx_reply'){ ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:2})) }
      } catch {}
    }
    ws.onclose = ()=>{ setTimeout(connect, 3000) }
    ws.onerror = ()=>{ ws.close() }
  }
  connect()
  // heartbeat every 25s
  setInterval(()=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:99})) },25000)
}

// Clock
setInterval(()=>{ $('clk').textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}) },1000)

// Init
fetchOrders()
setInterval(fetchOrders, 15000) // fallback poll every 15s
connectRealtime()
</script>
</body>
</html>
