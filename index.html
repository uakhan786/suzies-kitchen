<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Suzie's Pastry Shoppe — Staff Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf6ef;--cream2:#f2ead8;--parchment:#e8dcc8;--rose:#b5445a;--rose2:#8c2d42;--gold:#c8a96e;--ink:#1a1410;--ink2:#3d2e24;--muted:#9a8878;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);min-height:100vh;overflow-x:hidden;position:relative;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(200,169,110,.08) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 80% 90%,rgba(181,68,90,.06) 0%,transparent 60%);pointer-events:none;z-index:0;}
.top-rule{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent 0%,var(--gold) 30%,var(--rose) 60%,transparent 100%);z-index:10;}
.wrapper{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px 60px;}
.header{text-align:center;margin-bottom:52px;animation:fadeUp .9s ease both;}
.logo-wrap{width:130px;height:130px;margin:0 auto 26px;position:relative;display:flex;align-items:center;justify-content:center;}
.logo-ring{position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--parchment);animation:spin 20s linear infinite;}
.logo-ring::before{content:'✦';position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--gold);background:var(--cream);padding:0 4px;}
.logo-img{width:130px;height:130px;border-radius:50%;object-fit:cover;border:3px solid var(--cream2);box-shadow:0 8px 40px rgba(26,20,16,.14),0 2px 8px rgba(200,169,110,.2);}
@keyframes spin{to{transform:rotate(360deg)}}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,6vw,48px);font-weight:300;color:var(--ink);letter-spacing:.04em;line-height:1.1;margin-bottom:8px;}
.brand-name em{font-style:italic;color:var(--rose2);}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0;}
.dl{height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--gold));}
.dl:last-child{background:linear-gradient(90deg,var(--gold),transparent);}
.do{font-size:11px;color:var(--gold);}
.brand-sub{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:600px;animation:fadeUp .9s .2s ease both;}
@media(max-width:500px){.cards{grid-template-columns:1fr;max-width:340px;}}
.card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 28px 40px;border-radius:4px;cursor:pointer;text-decoration:none;transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s ease;overflow:hidden;min-height:260px;justify-content:center;}
.card::after{content:'';position:absolute;top:14px;right:14px;width:28px;height:28px;border-top:1px solid rgba(255,255,255,.18);border-right:1px solid rgba(255,255,255,.18);border-radius:0 3px 0 0;}
.card:hover{transform:translateY(-7px);}
.card:active{transform:scale(.98);}
.card-order{background:var(--rose);box-shadow:0 4px 24px rgba(181,68,90,.22);}
.card-order:hover{box-shadow:0 20px 60px rgba(181,68,90,.32);}
.card-kitchen{background:var(--ink2);box-shadow:0 4px 24px rgba(26,20,16,.22);}
.card-kitchen:hover{box-shadow:0 20px 60px rgba(26,20,16,.32);}
.shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.07) 50%,transparent 60%);transform:translateX(-100%);transition:transform .6s ease;pointer-events:none;}
.card:hover .shine{transform:translateX(100%);}
.ci{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;}
.icon{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:22px;font-size:30px;}
.card-order .icon{background:rgba(255,255,255,.14);box-shadow:0 0 0 1px rgba(255,255,255,.1);}
.card-kitchen .icon{background:rgba(200,169,110,.14);box-shadow:0 0 0 1px rgba(200,169,110,.12);}
.ct{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;color:#fff;letter-spacing:.02em;line-height:1.1;}
.card-kitchen .ct{color:#f5ede0;}
.cr{width:32px;height:1px;background:rgba(255,255,255,.25);margin:14px auto;}
.card-kitchen .cr{background:rgba(200,169,110,.35);}
.cd{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);line-height:2;}
.card-kitchen .cd{color:rgba(200,169,110,.65);}
.ca{margin-top:22px;font-size:18px;color:rgba(255,255,255,.3);transition:transform .3s ease,color .3s ease;}
.card-kitchen .ca{color:rgba(200,169,110,.3);}
.card:hover .ca{transform:translateX(5px);color:rgba(255,255,255,.65);}
.card-kitchen:hover .ca{color:rgba(200,169,110,.65);}
.footer{margin-top:52px;text-align:center;animation:fadeUp .9s .4s ease both;}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.65);border:1px solid var(--parchment);border-radius:20px;padding:8px 18px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.dot{width:6px;height:6px;border-radius:50%;background:#5ab87d;animation:pulse 2.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(90,184,125,.4)}50%{opacity:.7;box-shadow:0 0 0 4px rgba(90,184,125,0)}}
.ftime{font-size:11px;color:var(--muted);letter-spacing:.08em;opacity:.6;margin-bottom:12px;}
.tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--muted);opacity:.5;letter-spacing:.06em;}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="top-rule"></div>
<div class="wrapper">
  <header class="header">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <img class="logo-img" id="logo" alt="Suzie's Pastry Shoppe logo"/>
    </div>
    <h1 class="brand-name">Suzie's <em>Pastry</em> Shoppe</h1>
    <div class="divider"><div class="dl"></div><span class="do">✦</span><div class="dl"></div></div>
    <p class="brand-sub">Staff Portal</p>
  </header>
  <div class="cards">
    <a class="card card-order" href="/suzies_order_entry.html">
      <div class="shine"></div>
      <div class="ci">
        <div class="icon">🛎️</div>
        <div class="ct">Order Entry</div>
        <div class="cr"></div>
        <div class="cd">Front of House<br>Take &amp; Submit Orders</div>
        <div class="ca">&#8594;</div>
      </div>
    </a>
    <a class="card card-kitchen" href="/suzies_kitchen_display.html">
      <div class="shine"></div>
      <div class="ci">
        <div class="icon">🍽️</div>
        <div class="ct">Kitchen Display</div>
        <div class="cr"></div>
        <div class="cd">Kitchen Staff<br>View &amp; Manage Orders</div>
        <div class="ca">&#8594;</div>
      </div>
    </a>
  </div>
  <footer class="footer">
    <div class="pill"><div class="dot"></div>System Online</div>
    <div class="ftime" id="time"></div>
    <div class="tagline">Handcrafted with care, every order.</div>
  </footer>
</div>
